version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: overseer-postgres-dev
    environment:
      POSTGRES_DB: overseer_dev
      POSTGRES_USER: overseer
      POSTGRES_PASSWORD: overseer_dev_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overseer -d overseer_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - overseer-network

  redis:
    image: redis:7-alpine
    container_name: overseer-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - overseer-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: overseer-api-dev
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://overseer:overseer_dev_password@postgres:5432/overseer_dev
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=dev_secret_key_change_in_production
      - LOG_LEVEL=debug
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/venv
      - /app/__pycache__
      - /app/.pytest_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
    networks:
      - overseer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  overseer-network:
    driver: bridge
